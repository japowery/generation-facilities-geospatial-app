name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate generated store and source
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Validate generated data
        run: |
          python tests/validate_data.py
          python -O tests/validate_data.py

      - name: Check Python sources
        run: python -m py_compile scripts/build_data.py tests/validate_data.py

      - name: Check JavaScript sources
        run: |
          node --check assets/app.js
          node --check tests/browser_smoke.mjs
